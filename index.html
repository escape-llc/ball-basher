<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="/bb_64.png" />
	<link rel="stylesheet" type="text/css" href="style.css"/>
	<link rel="stylesheet" type="text/css" href="hub.css"/>
	<title>Ball Basher</title>
</head>

<body>
	<canvas id="renderCanvas"></canvas>
	<div id="ui">
		<div class="left-side">
			<div class="pill"><span class="label" style="margin-right:0.2rem">v</span><span class="value" id="version">1</span></div>
			<div class="pill"><span class="label">Score </span><span class="value" id="score">0</span></div>
			<div class="pill"><span class="label">Balls </span><span class="value" id="balls" style="width:3rem">3</span>
			</div>
		</div>
		<div class="right-side">
			<div class="pill"><span class="label" style="margin-right:0.2rem">g</span><span class="value" id="gravity">-</span></div>
			<div class="pill"><span class="label">Round </span><span class="value" id="round" style="width:3rem">1</span></div>
			<div class="pill"><span class="label">Time </span><span class="value" id="time" style="width:3rem;max-width:3rem">30</span></div>
		</div>
	</div>
	<div id="leaderboard">
		<div id="gamePanel" class="game-panel interactive">
			<div class="panel-header">
					<h3 class="panel-title">Game Hub (H)</h3>
					<button id="closePanelBtn" class="close-icon-btn" onclick="document.getElementById('gamePanel').style.display='none'">&times;</button>
			</div>

			<!-- Authentic State Display Segment Container Section -->
			<div id="authSection" class="auth-block">
					<p style="margin-top:0; font-size:14px; color:white;">Sign in to sync high-scores</p>
					<button id="googleLoginBtn" class="google-auth-btn">
							<!-- Base Inline Vector Google Icon Graph Vector G Symbol -->
							<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.84 2.07-1.79 2.7v2.25h2.91c1.7-1.56 2.68-3.86 2.68-6.6z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.2l-2.91-2.25c-.8.54-1.83.86-3.05.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.32C2.43 15.98 5.46 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.98H.95A8.99 8.99 0 0 0 0 9c0 1.45.35 2.82.95 4.02l3.02-2.32z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35L15 2.1C13.46.68 11.42 0 9 0 5.46 0 2.43 2.02.95 4.98l3.02 2.32C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
							Continue with Google
					</button>
			</div>

			<!-- Logged-In Gameplay Interface Frame Block Segment -->
			<div id="gameSection" class="game-block" style="display: none;">
					<div style="font-size: 13px; color: #a7f3d0; margin-bottom: 10px; word-break: break-all;" id="statusText">Profile: Active</div>
					<button id="logoutBtn" class="action-button danger" style="padding:4px 8px; font-size:11px;">Disconnect Profile</button>
			</div>

			<!-- Global Leader Rankings Panel Table Segment -->
			<div class="rank-container">
					<table class="rank-table">
							<thead>
									<tr>
											<th>Pos</th>
											<th>Player</th>
											<th style="text-align: right; padding-right:8px;">Score</th>
									</tr>
							</thead>
							<tbody id="leaderboardData">
									<!-- Instantiated matching rows will print automatically -->
							</tbody>
					</table>
			</div>
		</div>
	</div>
	<div id="startMessage">Press SPACE to Start</div>
	<div id="gameOver" style="display:none">Game Over</div>
	<script type="module" src="./src/game.ts"></script>
</body>

</html>
